# AMH connector manifest — see docs/AMH-SPECIFICATION.md Artifact G.
# Reference connector: a single SSH-controlled reversible device action,
# used by the greenhouse scenario (Artifact H, steps 1-4).
apiVersion: amh/v1
kind: Connector
metadata:
  name: greenhouse-vent
  version: 0.1.0
spec:
  type: ssh
  host: "${AMH_VENT_HOST}"
  port: 22
  auth: apikey   # private key path supplied via connector config, not committed
  devices:
    - id: vent-actuator
      bounds:
        open_pct: [0, 100]
      actions:
        - name: set_open_pct
          reversible: true
          inverse_template: "set_open_pct(prior_open_pct)"
          # verified_at is set only after the inverse has been tested against
          # the real device — see daemon/connectors/ssh for the verification step.
          verified_at: null
          # No ApprovalGate once verified_at is set: autonomous, self-healing
          # can auto-reverse if a fault follows (§11, §14.6).
